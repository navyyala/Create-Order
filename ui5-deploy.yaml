specVersion: "3.0"
metadata:
  name: po-createorder
type: application
framework:
  name: SAPUI5
  version: "1.71.84"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ushell
